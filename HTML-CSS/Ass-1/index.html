<!-- index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Pikachu Landing Page</title>

  <!-- CSS -->
  <link rel="stylesheet" href="style.css"/>

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

  <div class="container">

    <!-- LEFT SECTION -->
    <div class="left-section">

      <!-- Logo -->
      <img 
        src="./assets/International_Pokémon_logo.svg.png" 
        alt="pokemon logo"
        class="logo"
      >

      <!-- Content -->
      <div class="content">

        <p class="subtitle">POKEMON GEN I</p>

        <h1>Pikachu</h1>

        <p class="description">
          Pikachu is an Electric-type Pokémon introduced
          in Generation I. Pikachu are small, chubby,
          and incredibly cute mouse-like Pokémon.
          They are almost completely covered by
          yellow fur.
        </p>

        <!-- Pagination -->
        <div class="pagination">
          <div class="line"></div>
          <span>01 / 08</span>
        </div>

      </div>

      <!-- Pokeball -->
      <div class="pokeball"></div>

    </div>

    <!-- RIGHT SECTION -->
    <div class="right-section">

      <!-- Menu -->
      <div class="menu">
        <span></span>
        <span></span>
        <span></span>
      </div>

      <!-- Pikachu Image -->
      <img
        src="assets/images-removebg-preview.png"
        alt="pikachu"
        class="pikachu"
      >

      <!-- Dots -->
      <div class="dots">
        <span class="active"></span>
        <span></span>
        <span></span>
        <span></span>
      </div>

    </div>

  </div>

</body>
</html>
