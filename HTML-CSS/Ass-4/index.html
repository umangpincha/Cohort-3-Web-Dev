<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Grid Layout</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main>
        <!-- Top Left -->
        <div class="left-top">
            <img src="https://images.unsplash.com/photo-1643725173053-ed68676f1878?q=80&w=2070&auto=format&fit=crop" alt="">
        </div>

        <!-- Top Center -->
        <div class="left-center">
            <img src="https://images.unsplash.com/photo-1590955559496-50316bd28ff2?q=80&w=2111&auto=format&fit=crop" alt="">
        </div>

        <!-- Sidebar -->
        <div class="right-center">
            <nav>
                <ul class="list">
                    <li>Category</li>
                    <li>Payment</li>
                    <li>Authors</li>
                    <li>Auction</li>
                    <li>Sales</li>
                    <li>Reviews</li>
                    <li class="line"></li>
                    <li>Contacts</li>
                </ul>
            </nav>
        </div>

        <div class="right-top">
            <img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?q=80&w=2000&auto=format&fit=crop" alt="">
        </div>

        <div class="left-bottom">
            <img src="https://images.unsplash.com/photo-1517841905240-472988babdf9?q=80&w=2000&auto=format&fit=crop" alt="">
        </div>

        <div class="left-bottom1">
            <img src="https://images.unsplash.com/photo-1524504388940-b1c1722653e1?q=80&w=2000&auto=format&fit=crop" alt="">
        </div>

        <div class="left-bottom2">
            <img src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?q=80&w=2000&auto=format&fit=crop" alt="">
        </div>

        <!-- Dark Card -->
        <div class="left-bottom3">
            <img src="https://images.unsplash.com/photo-1500648767791-00dcc994a43e?q=80&w=2000&auto=format&fit=crop" alt="">
        </div>

        <div class="right-center2">
            <img src="https://images.unsplash.com/photo-1487412720507-e7ab37603c6f?q=80&w=2000&auto=format&fit=crop" alt="">
        </div>

        <div class="right-bottom">
            <img src="https://images.unsplash.com/photo-1521119989659-a83eee488004?q=80&w=2000&auto=format&fit=crop" alt="">
        </div>
    </main>

</body>
</html>
